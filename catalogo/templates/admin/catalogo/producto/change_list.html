{# Extiende de la plantilla base original del listado del panel de administración #}
{% extends "admin/change_list.html" %}

{% block content %}
<style>
    /* Oculta por completo la barra predeterminada con el desplegable (-------) y el botón Go de Django */
    .actions, select[name="action"], button[name="index"], .action-counter {
        display: none !important;
    }
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // Localiza el botón nativo de la cabecera ("+ Añadir producto")
    var addBtn = document.querySelector('a[href*="/add/"]');
    
    if (addBtn) {
        // Crea el botón rojo estilizado con clases de Bootstrap para la eliminación de productos
        var btnEliminar = document.createElement('button');
        btnEliminar.type = 'button';
        btnEliminar.className = 'btn btn-danger ms-2 font-weight-bold';
        btnEliminar.innerHTML = '<i class="fas fa-trash-alt me-1"></i> Eliminar producto';
        
        // Define el comportamiento interactivo al hacer clic sobre el botón
        btnEliminar.onclick = function() {
            // Revisa cuáles casillas del listado de productos han sido marcadas por el usuario
            var checkboxes = document.querySelectorAll('input[name="_selected_action"]:checked');
            
            // Si no se seleccionó ningún producto, cancela la acción y muestra una advertencia
            if (checkboxes.length === 0) {
                alert('Por favor, marca primero la casilla del producto que deseas eliminar.');
                return;
            }
            
            // Selecciona el formulario y el selector oculto para asignarle la acción de borrado masivo
            var selectAction = document.querySelector('select[name="action"]');
            var form = document.getElementById('changelist-form');
            
            if (selectAction && form) {
                selectAction.value = 'delete_selected';
                form.submit();
            }
        };
        
        // Inserta el nuevo botón rojo a la derecha del botón "+ Añadir producto"
        addBtn.parentNode.insertBefore(btnEliminar, addBtn.nextSibling);
    }
});
</script>

{% endblock %}
